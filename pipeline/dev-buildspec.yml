version: '0.2'

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      # - set -euo pipefail
      - echo "== pwd & tree =="
      - pwd
      - ls -la

      # --- Infra (CDK) ---
      - echo "== Install infra (CDK) =="
      - cd infra
      - npm ci
      # Opcional: verifica tsc local (no instales tsc global)
      - npx tsc --version
      - cd ..

      # --- Lambdas ---
      - echo "== Install all lambdas =="
      - if [ -d lambdas ]; then
          cd lambdas;
          for d in */ ; do
            if [ -f "$d/package.json" ]; then
              echo "Installing in lambdas/$d";
              (cd "$d" && npm ci);
            fi;
          done;
          cd ..;
        else
          echo "No lambdas directory found, skipping.";
        fi

  build:
    commands:
      - set -euo pipefail

      # --- Build infra (CDK) ---
      - echo "== Build infra (CDK) =="
      - cd infra
      - npx tsc
      - cd ..

      # --- Build lambdas ---
      - echo "== Build all lambdas =="
      - if [ -d lambdas ]; then
          cd lambdas;
          for d in */ ; do
            if [ -f "$d/package.json" ]; then
              echo "Building lambdas/$d";
              (cd "$d" && npm run build);
            fi;
          done;
          cd ..;
        else
          echo "No lambdas directory found, skipping.";
        fi

      # --- CDK synth & deploy ---
      - echo "== CDK synth =="
      - cd infra
      - npx cdk synth --context env=dev --verbose
      - echo "== CDK deploy =="
      - npx cdk deploy --all --context env=dev --require-approval never
